name = "robynn-mcp-server"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Non-secret configuration only. Secrets are never committed here; they are set
# out of band (`wrangler secret put`, by the release owner):
#   MCP_INTERNAL_AUTH_SECRET  required. Signs Worker -> app internal requests
#                             (/api/oauth/token code exchange and refresh).
#                             Must equal the app's MCP_INTERNAL_AUTH_SECRET.
# CONNECTOR_STATE_SECRET is not read by this Worker and must not be set here.
[vars]
ROBYNN_API_BASE_URL = "https://robynn.ai"
MCP_PUBLIC_BASE_URL = "https://mcp.robynn.ai"
MCP_SERVER_NAME = "Robynn"
MCP_SERVER_VERSION = "0.1.5"

[[kv_namespaces]]
binding = "OAUTH_KEY"
id = "5727f263cda54e439bd998f618878b18"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "5727f263cda54e439bd998f618878b18"

# MCP_OBJECT hosts one MCP session per DO. REFRESH_COORDINATOR serializes
# host refreshes per provider grant (`refresh:{grantId}`, COS-PLUGIN-001 P10);
# it stores nothing.
[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "RobynnMCP" },
  { name = "REFRESH_COORDINATOR", class_name = "RefreshCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RobynnMCP"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RefreshCoordinator"]

# R2 binding: read-only access to the vault bucket the materializer cron
# writes to (robynnv3 /api/cron/vault-materializer). Bind directly so the
# Worker reads via env.VAULT.get / .list with no IAM tokens crossing the
# wire. Per-org gating happens in the tool handler against
# this.props.organizationId from the OAuth session.
[[r2_buckets]]
binding = "VAULT"
bucket_name = "robynn-materialized"

# Uncomment when deploying with custom domain:
# [[routes]]
# pattern = "mcp.robynn.ai/*"
# custom_domain = true
